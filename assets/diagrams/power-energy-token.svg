<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" role="img" aria-labelledby="title desc">
<title id="title">LLM 推理中 Watt、Energy、Joule per token 与 tokens per Joule</title>
<desc id="desc">功率Watt是瞬时速率，能量Joule是功率随时间积分；一次固定工作负载的总能量除以有效token得到J每token，token除以总能量得到token每J，并强调prefill与decode应分开统计。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.box{fill:#fff;stroke:#555;stroke-width:2}.soft{fill:#f3f3f3;stroke:#888;stroke-width:1.5}.axis{stroke:#555;stroke-width:2}.curve{stroke:#222;stroke-width:4;fill:none}.area{fill:#e6e6e6;stroke:none}.dash{stroke:#888;stroke-width:1.5;stroke-dasharray:6 5}.h{font-size:23px;font-weight:700}.t{font-size:16px}.s{font-size:13px}</style>
<text class="h" x="35" y="40">功率是“此刻烧多快”，能量是“整次任务一共烧了多少”</text>
<g transform="translate(70 95)">
<line class="axis" x1="50" y1="300" x2="610" y2="300"/><line class="axis" x1="50" y1="300" x2="50" y2="20"/>
<text class="s" x="25" y="28">Power</text><text class="s" x="600" y="328">time</text>
<path class="area" d="M50 300 L50 235 C120 220 165 180 225 190 C300 205 330 115 405 130 C475 145 520 165 610 160 L610 300 Z"/>
<path class="curve" d="M50 235 C120 220 165 180 225 190 C300 205 330 115 405 130 C475 145 520 165 610 160"/>
<line class="dash" x1="225" y1="30" x2="225" y2="300"/><line class="dash" x1="405" y1="30" x2="405" y2="300"/>
<text class="s" x="130" y="350" text-anchor="middle">load / prefill</text><text class="s" x="315" y="350" text-anchor="middle">transition</text><text class="s" x="505" y="350" text-anchor="middle">decode</text>
<text class="t" x="330" y="382" text-anchor="middle">灰色面积 = ∫ P(t) dt = Energy</text>
</g>
<g transform="translate(735 105)">
<rect class="box" x="0" y="0" width="355" height="255" rx="16"/>
<text x="177" y="34" text-anchor="middle" font-size="18" font-weight="700">同一 workload 的四个量</text>
<text class="t" x="25" y="78">Power = J/s = Watt</text>
<text class="t" x="25" y="118">Energy = ∫ Power dt</text>
<text class="t" x="25" y="158">J/token = Energy / useful tokens</text>
<text class="t" x="25" y="198">tokens/J = useful tokens / Energy</text>
<text class="s" x="177" y="232" text-anchor="middle">必须固定 prompt/output/quality 条件</text>
</g>
<g transform="translate(690 405)">
<rect class="soft" x="0" y="0" width="400" height="125" rx="14"/><text x="200" y="30" text-anchor="middle" class="t" font-weight="700">为什么“更低 Watt”不一定更省电？</text>
<text class="s" x="25" y="62">设备 A：功率低，但运行更久</text><text class="s" x="25" y="86">设备 B：功率高，但更快完成</text><text class="s" x="25" y="110">最终比较 Energy / useful work，而不是只看瞬时功率</text>
</g>
<g transform="translate(85 515)">
<rect class="soft" x="0" y="0" width="520" height="78" rx="12"/><text x="260" y="28" text-anchor="middle" class="t">Prefill 与 Decode 分开</text><text x="260" y="54" text-anchor="middle" class="s">两阶段的算术强度、持续时间和功率状态不同；混成一个平均值会隐藏瓶颈。</text>
</g>
<text x="580" y="625" text-anchor="middle" class="s">教学图不代表任何具体 GPU 的实测功率曲线；真实能效必须来自同步采样的功率时间序列与同一 workload 的完成量。</text>
</svg>