<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Continuous batching timeline</title><desc id="desc">Requests arrive at different times and occupy decode slots; completed requests release slots so new requests can join without waiting for the entire original batch to finish.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;fill:#18222c}.h{font-size:30px;font-weight:700}.t{font-size:17px;font-weight:700}.s{font-size:14px;fill:#52606d}.slot{fill:#eef6ff;stroke:#4f82b5;stroke-width:2;rx:10}.new{fill:#eef8f1;stroke:#5d966c;stroke-width:2;rx:10}.empty{fill:#f5f6f8;stroke:#9aa5b1;stroke-width:2;rx:10}.a{stroke:#5f6f7f;stroke-width:2;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#5f6f7f"/></marker></defs>
<text x="45" y="52" class="h">Experiment 11–12：Continuous batching 看“slot 如何随请求完成而滚动”</text>
<text x="175" y="105" class="t">t0</text><text x="465" y="105" class="t">t1</text><text x="755" y="105" class="t">t2</text><text x="1045" y="105" class="t">t3</text>
<rect x="95" y="135" width="170" height="55" class="slot"/><text x="180" y="168" text-anchor="middle" class="s">A decode</text><rect x="95" y="205" width="170" height="55" class="slot"/><text x="180" y="238" text-anchor="middle" class="s">B decode</text><rect x="95" y="275" width="170" height="55" class="slot"/><text x="180" y="308" text-anchor="middle" class="s">C decode</text>
<rect x="385" y="135" width="170" height="55" class="slot"/><text x="470" y="168" text-anchor="middle" class="s">A decode</text><rect x="385" y="205" width="170" height="55" class="empty"/><text x="470" y="238" text-anchor="middle" class="s">B done → free</text><rect x="385" y="275" width="170" height="55" class="slot"/><text x="470" y="308" text-anchor="middle" class="s">C decode</text>
<rect x="675" y="135" width="170" height="55" class="slot"/><text x="760" y="168" text-anchor="middle" class="s">A decode</text><rect x="675" y="205" width="170" height="55" class="new"/><text x="760" y="238" text-anchor="middle" class="s">D joins slot</text><rect x="675" y="275" width="170" height="55" class="slot"/><text x="760" y="308" text-anchor="middle" class="s">C decode</text>
<rect x="965" y="135" width="170" height="55" class="empty"/><text x="1050" y="168" text-anchor="middle" class="s">A done</text><rect x="965" y="205" width="170" height="55" class="new"/><text x="1050" y="238" text-anchor="middle" class="s">D decode</text><rect x="965" y="275" width="170" height="55" class="slot"/><text x="1050" y="308" text-anchor="middle" class="s">C decode</text>
<path d="M265 365 H1135" class="a"/><text x="550" y="395" class="s">观察重点：slot utilization、queue wait、TTFT、per-request TG、tail latency，而不只看总吞吐。</text>
</svg>