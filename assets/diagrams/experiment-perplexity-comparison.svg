<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Perplexity comparison boundary</title><desc id="desc">Perplexity is the exponential of average cross entropy. Lower values are comparable only when tokenizer, corpus and evaluation protocol are fixed; changing any of those invalidates a direct comparison.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;fill:#18222c}.h{font-size:30px;font-weight:700}.t{font-size:18px;font-weight:700}.s{font-size:14px;fill:#52606d}.b{fill:#eef6ff;stroke:#4f82b5;stroke-width:2;rx:14}.gate{fill:#eef8f1;stroke:#5d966c;stroke-width:2;rx:14}.bad{fill:#fff0f0;stroke:#b85c5c;stroke-width:2;rx:14}.a{stroke:#5e6f7f;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#5e6f7f"/></marker></defs><text x="45" y="52" class="h">Experiment 58–59：PPL 数字只有在比较协议相同的时候才有方向意义</text><rect x="55" y="125" width="275" height="120" class="b"/><text x="192" y="168" text-anchor="middle" class="t">cross entropy</text><text x="192" y="202" text-anchor="middle" class="s">avg −log p(true next token)</text><rect x="410" y="125" width="260" height="120" class="b"/><text x="540" y="168" text-anchor="middle" class="t">PPL = exp(loss)</text><text x="540" y="202" text-anchor="middle" class="s">lower is usually better</text><rect x="750" y="95" width="390" height="180" class="gate"/><text x="945" y="135" text-anchor="middle" class="t">Direct-comparison gate</text><text x="790" y="175" class="s">same tokenizer</text><text x="790" y="205" class="s">same corpus / sample boundaries</text><text x="790" y="235" class="s">same context / stride / protocol</text><path d="M330 185 H403" class="a"/><path d="M670 185 H743" class="a"/><rect x="245" y="335" width="710" height="95" class="bad"/><text x="600" y="372" text-anchor="middle" class="t">协议不同 → 不允许把 PPL 差异直接解释成模型质量差异</text><text x="600" y="405" text-anchor="middle" class="s">PPL 也不是所有任务质量的万能分数；它只支持与该评估定义相匹配的 claim。</text></svg>