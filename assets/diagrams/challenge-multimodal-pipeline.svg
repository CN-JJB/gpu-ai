<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Multimodal local inference pipeline</title><desc id="desc">Image input is preprocessed and encoded into visual tokens or embeddings, text is tokenized separately, the modalities are combined according to the model architecture, and the language decoder generates output; each preprocessing and model component has its own identity.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;fill:#18222c}.h{font-size:30px;font-weight:700}.t{font-size:17px;font-weight:700}.s{font-size:13px;fill:#52606d}.img{fill:#eef6ff;stroke:#4f82b5;stroke-width:2;rx:13}.txt{fill:#f4f0ff;stroke:#7965b0;stroke-width:2;rx:13}.mix{fill:#fff7e8;stroke:#bd8a30;stroke-width:2;rx:13}.out{fill:#eef8f1;stroke:#5d966c;stroke-width:2;rx:13}.a{stroke:#5e6f7f;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#5e6f7f"/></marker></defs><text x="45" y="52" class="h">Challenge 12：多模态推理多了一条视觉编码链，Evidence identity 也因此更多</text><rect x="45" y="105" width="195" height="95" class="img"/><text x="142" y="143" text-anchor="middle" class="t">Image bytes</text><text x="142" y="172" text-anchor="middle" class="s">exact file/hash</text><rect x="300" y="105" width="210" height="95" class="img"/><text x="405" y="143" text-anchor="middle" class="t">Preprocess</text><text x="405" y="172" text-anchor="middle" class="s">resize/crop/normalize</text><rect x="570" y="105" width="210" height="95" class="img"/><text x="675" y="143" text-anchor="middle" class="t">Vision encoder</text><text x="675" y="172" text-anchor="middle" class="s">visual tokens/features</text><rect x="45" y="285" width="195" height="95" class="txt"/><text x="142" y="323" text-anchor="middle" class="t">Text prompt</text><rect x="300" y="285" width="210" height="95" class="txt"/><text x="405" y="323" text-anchor="middle" class="t">Tokenizer</text><text x="405" y="352" text-anchor="middle" class="s">text token IDs</text><rect x="850" y="185" width="190" height="115" class="mix"/><text x="945" y="225" text-anchor="middle" class="t">Fusion / projector</text><text x="945" y="256" text-anchor="middle" class="s">model-specific interface</text><rect x="1080" y="185" width="100" height="115" class="out"/><text x="1130" y="225" text-anchor="middle" class="t">LLM</text><text x="1130" y="256" text-anchor="middle" class="s">decode</text><path d="M240 152 H293" class="a"/><path d="M510 152 H563" class="a"/><path d="M780 152 H820 V220 H843" class="a"/><path d="M240 332 H293" class="a"/><path d="M510 332 H820 V265 H843" class="a"/><path d="M1040 242 H1073" class="a"/><text x="55" y="455" class="s">比较模型/后端时要固定：image preprocessing、vision encoder/projector identity、text template/tokenizer、precision 与 runtime backend。</text></svg>