<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Kernel optimization evidence loop</title><desc id="desc">Kernel work proceeds from a reference implementation through correctness, profiling, one hypothesis, one code change, repeated measurement and bounded interpretation, with failure returning to the previous known-good state.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;fill:#18222c}.h{font-size:30px;font-weight:700}.t{font-size:17px;font-weight:700}.s{font-size:13px;fill:#52606d}.b{fill:#f6f8fb;stroke:#8ba0b5;stroke-width:2;rx:13}.gate{fill:#eef8f1;stroke:#5d966c;stroke-width:2;rx:13}.warn{fill:#fff7e8;stroke:#bd8a30;stroke-width:2;rx:13}.a{stroke:#5e6f7f;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#5e6f7f"/></marker></defs><text x="45" y="52" class="h">Challenge 04：Kernel 优化先守 correctness，再做 one-hypothesis A/B</text><rect x="45" y="125" width="180" height="95" class="b"/><text x="135" y="163" text-anchor="middle" class="t">Reference</text><text x="135" y="192" text-anchor="middle" class="s">known-correct baseline</text><rect x="270" y="125" width="180" height="95" class="gate"/><text x="360" y="163" text-anchor="middle" class="t">Correctness gate</text><text x="360" y="192" text-anchor="middle" class="s">output / tolerance</text><rect x="495" y="125" width="180" height="95" class="b"/><text x="585" y="163" text-anchor="middle" class="t">Profile</text><text x="585" y="192" text-anchor="middle" class="s">identify bottleneck</text><rect x="720" y="125" width="180" height="95" class="warn"/><text x="810" y="163" text-anchor="middle" class="t">One change</text><text x="810" y="192" text-anchor="middle" class="s">one causal hypothesis</text><rect x="945" y="125" width="210" height="95" class="gate"/><text x="1050" y="163" text-anchor="middle" class="t">Measure again</text><text x="1050" y="192" text-anchor="middle" class="s">raw + repeated runs</text><path d="M225 172 H263" class="a"/><path d="M450 172 H488" class="a"/><path d="M675 172 H713" class="a"/><path d="M900 172 H938" class="a"/><rect x="285" y="330" width="630" height="105" class="b"/><text x="600" y="369" text-anchor="middle" class="t">Interpret → keep or revert → next hypothesis</text><text x="600" y="401" text-anchor="middle" class="s">速度变快但 correctness 失败 = FAIL；一次 timing 变快也不自动升级为结论。</text><path d="M1050 220 V280 H600 V323" class="a"/><path d="M285 383 H135 V227" class="a"/></svg>