<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">本地 LLM 硬件决策门槛</title><desc id="desc">Fit 和 Support 是购买前硬门槛，通过后才进入 Roof 假设、实测 Evidence、TCO 和最终人工决策；Unknown 会阻断结论。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.box{fill:#fff;stroke:#555;stroke-width:2}.hard{fill:#f1f1f1;stroke:#333;stroke-width:2.5}.arrow{stroke:#555;stroke-width:3;fill:none;marker-end:url(#m)}.branch{stroke:#888;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#m)}.h{font-size:23px;font-weight:700}.t{font-size:15px}.s{font-size:13px}</style>
<defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs>
<text class="h" x="35" y="38">“性价比”不是起点：先过硬门槛，再谈快不快、值不值</text>
<g transform="translate(35 115)"><rect class="hard" x="0" y="0" width="160" height="95" rx="15"/><text x="80" y="30" text-anchor="middle" font-size="19" font-weight="700">1 · FIT</text><text class="s" x="80" y="55" text-anchor="middle">weights + KV + buffers</text><text class="s" x="80" y="74" text-anchor="middle">+ concurrency + margin</text></g>
<path class="arrow" d="M200 162 H245"/>
<g transform="translate(250 115)"><rect class="hard" x="0" y="0" width="160" height="95" rx="15"/><text x="80" y="30" text-anchor="middle" font-size="19" font-weight="700">2 · SUPPORT</text><text class="s" x="80" y="55" text-anchor="middle">device × OS × driver</text><text class="s" x="80" y="74" text-anchor="middle">backend × quant kernel</text></g>
<path class="arrow" d="M415 162 H460"/>
<g transform="translate(465 115)"><rect class="box" x="0" y="0" width="160" height="95" rx="15"/><text x="80" y="30" text-anchor="middle" font-size="19" font-weight="700">3 · ROOFS</text><text class="s" x="80" y="55" text-anchor="middle">capacity / bandwidth</text><text class="s" x="80" y="74" text-anchor="middle">compute / interconnect</text></g>
<path class="arrow" d="M630 162 H675"/>
<g transform="translate(680 115)"><rect class="box" x="0" y="0" width="160" height="95" rx="15"/><text x="80" y="30" text-anchor="middle" font-size="19" font-weight="700">4 · EVIDENCE</text><text class="s" x="80" y="55" text-anchor="middle">controlled PP / TG</text><text class="s" x="80" y="74" text-anchor="middle">quality / stability</text></g>
<path class="arrow" d="M845 162 H890"/>
<g transform="translate(895 115)"><rect class="box" x="0" y="0" width="190" height="95" rx="15"/><text x="95" y="30" text-anchor="middle" font-size="19" font-weight="700">5 · TCO + HUMAN</text><text class="s" x="95" y="55" text-anchor="middle">PSU · cooling · power</text><text class="s" x="95" y="74" text-anchor="middle">risk · time · resale</text></g>
<path class="branch" d="M115 215 V300"/><path class="branch" d="M330 215 V300"/>
<rect class="box" x="50" y="310" width="345" height="80" rx="14"/><text x="222" y="340" text-anchor="middle" font-size="17" font-weight="700">FAIL / UNKNOWN → BLOCKED</text><text class="t" x="222" y="365" text-anchor="middle">纸面峰值、低价和“别人能跑”不能越过 hard gate</text>
<rect class="box" x="535" y="295" width="510" height="108" rx="14"/><text x="790" y="326" text-anchor="middle" font-size="17" font-weight="700">证据强度也要单独记</text><text class="t" x="790" y="353" text-anchor="middle">DOCUMENTED → THIRD-PARTY → MEASURED-OWNED</text><text class="s" x="790" y="378" text-anchor="middle">“Support pass”说明有资格测，不等于性能/质量/TCO 已经通过。</text>
<text x="560" y="445" text-anchor="middle" class="s">最终购买动作始终是 human review；自动化只能收集与整理证据。</text></svg>