<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Naive attention 与 tiled online attention 的 I/O 对比</title>
<desc id="desc">左侧把完整 scores 和 probabilities 写回 HBM，右侧使用 Q/K/V tile、running max、running sum 和 accumulator 在片上处理，减少中间矩阵 HBM 往返。</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.panel{fill:#fff;stroke:#555;stroke-width:2}.hbm{fill:#f0f0f0;stroke:#777;stroke-width:1.5}.chip{fill:#fff;stroke:#888;stroke-width:1.5}.arrow{stroke:#555;stroke-width:2.5;fill:none;marker-end:url(#m)}.h{font-size:22px;font-weight:700}.t{font-size:15px}.s{font-size:13px}
</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs>
<text class="h" x="40" y="38">同样是 exact dense attention，差别可以主要来自“中间结果搬不搬回 HBM”</text>

<g transform="translate(35 75)">
<rect class="panel" x="0" y="0" width="480" height="390" rx="18"/><text x="240" y="35" text-anchor="middle" font-size="20" font-weight="700">直白 materialize 路径</text>
<rect class="chip" x="38" y="68" width="90" height="50" rx="9"/><text class="t" x="83" y="99" text-anchor="middle">Q</text>
<rect class="chip" x="150" y="68" width="90" height="50" rx="9"/><text class="t" x="195" y="99" text-anchor="middle">K</text>
<path class="arrow" d="M130 93 H145"/>
<rect class="hbm" x="282" y="62" width="155" height="62" rx="10"/><text class="t" x="360" y="89" text-anchor="middle">scores N×N</text><text class="s" x="360" y="109" text-anchor="middle">write to HBM</text>
<path class="arrow" d="M242 93 H277"/>
<rect class="hbm" x="282" y="160" width="155" height="62" rx="10"/><text class="t" x="360" y="187" text-anchor="middle">probs N×N</text><text class="s" x="360" y="207" text-anchor="middle">read/write HBM</text>
<path class="arrow" d="M360 127 V155"/>
<rect class="chip" x="150" y="265" width="90" height="50" rx="9"/><text class="t" x="195" y="296" text-anchor="middle">V</text>
<rect class="chip" x="282" y="260" width="155" height="62" rx="10"/><text class="t" x="360" y="288" text-anchor="middle">Output</text><text class="s" x="360" y="308" text-anchor="middle">probs × V</text>
<path class="arrow" d="M360 225 V255"/><path class="arrow" d="M242 290 H277"/>
<text class="s" x="240" y="360" text-anchor="middle">长序列时，N×N 中间量的往返会非常昂贵</text>
</g>

<g transform="translate(585 75)">
<rect class="panel" x="0" y="0" width="480" height="390" rx="18"/><text x="240" y="35" text-anchor="middle" font-size="20" font-weight="700">Tiled + online softmax 路径</text>
<rect class="hbm" x="30" y="72" width="120" height="75" rx="10"/><text class="t" x="90" y="102" text-anchor="middle">HBM</text><text class="s" x="90" y="124" text-anchor="middle">Q / K / V tiles</text>
<path class="arrow" d="M155 109 H200"/>
<rect class="chip" x="205" y="65" width="235" height="180" rx="14"/><text x="322" y="94" text-anchor="middle" font-size="17" font-weight="700">On-chip working set</text>
<rect class="chip" x="232" y="116" width="75" height="50" rx="8"/><text class="s" x="270" y="145" text-anchor="middle">score tile</text>
<rect class="chip" x="325" y="116" width="82" height="50" rx="8"/><text class="s" x="366" y="137" text-anchor="middle">running</text><text class="s" x="366" y="154" text-anchor="middle">m, l</text>
<rect class="chip" x="255" y="183" width="122" height="42" rx="8"/><text class="s" x="316" y="209" text-anchor="middle">weighted-V acc</text>
<path class="arrow" d="M322 250 V292"/>
<rect class="hbm" x="235" y="300" width="175" height="58" rx="10"/><text class="t" x="322" y="325" text-anchor="middle">final output</text><text class="s" x="322" y="345" text-anchor="middle">no full N×N writeback</text>
<text class="s" x="240" y="382" text-anchor="middle">分块处理 K/V；旧 running state 重标定后继续累加</text>
</g>
<text x="550" y="500" text-anchor="middle" class="t">数学复杂度仍可为 O(N²d)，但 HBM I/O 和峰值中间存储可以大幅下降。</text>
</svg>