<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
<title id="title">NVIDIA SM 教学抽象：从 warp 调度到执行与内存层级</title>
<desc id="desc">展示线程组成 warp，warp scheduler 从 ready warps 中发射指令到通用算术、矩阵和特殊功能路径，并通过寄存器、shared memory L1、L2 与显存形成数据层级。此图是跨代教学抽象，不是某一代 SM 的精确方框图。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.box{fill:#fff;stroke:#555;stroke-width:2}.soft{fill:#f3f3f3;stroke:#888;stroke-width:1.5}.line{stroke:#555;stroke-width:3;fill:none;marker-end:url(#m)}.dash{stroke:#888;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#m2)}.h{font-size:23px;font-weight:700}.t{font-size:16px}.s{font-size:13px}</style>
<defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker><marker id="m2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#888"/></marker></defs>
<text class="h" x="35" y="40">SM 不等于“CUDA Core 的盒子”：它是调度 + 多种执行路径 + 片上存储的组合</text>
<g transform="translate(40 85)">
<rect class="box" x="0" y="0" width="250" height="110" rx="14"/>
<text x="125" y="30" text-anchor="middle" font-size="18" font-weight="700">大量 threads</text>
<text class="s" x="125" y="55" text-anchor="middle">程序视角：很多独立线程</text>
<rect class="soft" x="35" y="70" width="180" height="28" rx="7"/><text class="s" x="125" y="89" text-anchor="middle">硬件成组：warp</text>
</g>
<path class="line" d="M290 140 H365"/>
<g transform="translate(370 80)">
<rect class="box" x="0" y="0" width="250" height="125" rx="14"/>
<text x="125" y="30" text-anchor="middle" font-size="18" font-weight="700">Warp scheduler(s)</text>
<text class="s" x="125" y="57" text-anchor="middle">从 resident warps 中找 ready work</text>
<text class="s" x="125" y="80" text-anchor="middle">memory stall 时切去别的 warp</text>
<text class="s" x="125" y="103" text-anchor="middle">TLP / ILP / dependency 都影响能否发射</text>
</g>
<path class="line" d="M620 142 H700"/>
<g transform="translate(705 55)">
<rect class="box" x="0" y="0" width="405" height="180" rx="14"/>
<text x="202" y="30" text-anchor="middle" font-size="18" font-weight="700">执行资源：不同指令走不同路径</text>
<rect class="soft" x="20" y="55" width="112" height="72" rx="10"/><text class="t" x="76" y="84" text-anchor="middle">FP / INT</text><text class="s" x="76" y="108" text-anchor="middle">通用算术</text>
<rect class="soft" x="146" y="55" width="112" height="72" rx="10"/><text class="t" x="202" y="84" text-anchor="middle">Matrix</text><text class="s" x="202" y="108" text-anchor="middle">Tensor Core*</text>
<rect class="soft" x="272" y="55" width="112" height="72" rx="10"/><text class="t" x="328" y="84" text-anchor="middle">SFU / LDST</text><text class="s" x="328" y="108" text-anchor="middle">特殊/访存路径</text>
<text class="s" x="202" y="154" text-anchor="middle">*不同代 SM 的资源数量、精度和组织并不相同</text>
</g>
<path class="line" d="M825 238 V290"/>
<g transform="translate(210 285)">
<rect class="box" x="0" y="0" width="740" height="120" rx="14"/>
<text x="370" y="28" text-anchor="middle" font-size="18" font-weight="700">片上数据层：越近越快，但容量越小、资源竞争越强</text>
<rect class="soft" x="25" y="52" width="190" height="50" rx="9"/><text class="t" x="120" y="82" text-anchor="middle">Registers</text>
<rect class="soft" x="275" y="52" width="190" height="50" rx="9"/><text class="t" x="370" y="82" text-anchor="middle">Shared memory</text>
<rect class="soft" x="525" y="52" width="190" height="50" rx="9"/><text class="t" x="620" y="82" text-anchor="middle">L1 / data cache</text>
</g>
<path class="line" d="M580 405 V465"/>
<rect class="box" x="350" y="468" width="460" height="62" rx="12"/><text x="580" y="494" text-anchor="middle" class="t">L2 cache → device memory / VRAM</text><text x="580" y="516" text-anchor="middle" class="s">带宽、访问合并、复用决定“更多核心”能否真正被喂饱</text>
<path class="dash" d="M420 470 C305 440 210 420 150 355"/><text class="s" x="205" y="438">长延迟触发 latency-hiding 需求</text>
<text x="580" y="578" text-anchor="middle" class="t" font-weight="700">跨代阅读固定问：scheduler 怎样找 ready work？执行路径增加了什么？片上数据怎样复用？memory roof 在哪里？</text>
<text x="580" y="603" text-anchor="middle" class="s">教学抽象，不代表 Tesla/Fermi/Kepler/Volta/Hopper 任一代 SM 的精确物理结构。</text>
</svg>