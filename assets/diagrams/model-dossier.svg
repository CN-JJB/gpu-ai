<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 510" role="img" aria-labelledby="title desc"><title id="title">从模型身份与 config 到硬件假设的 Model Dossier</title><desc id="desc">模型调查分为Identity Architecture Artifact Runtime四层，前三层事实产生weight和KV预算，再形成可被实测推翻的fit、PP、TG和quality假设，并保留unknown。</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.box{fill:#fff;stroke:#555;stroke-width:2}.fact{fill:#f3f3f3;stroke:#888;stroke-width:1.5}.arrow{stroke:#555;stroke-width:3;fill:none;marker-end:url(#m)}.h{font-size:23px;font-weight:700}.t{font-size:15px}.s{font-size:13px}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs><text class="h" x="35" y="38">模型名不是硬件需求；先把事实层拆开，再生成可被推翻的 hypothesis</text><g transform="translate(40 90)"><rect class="fact" x="0" y="0" width="220" height="95" rx="14"/><text x="110" y="30" text-anchor="middle" font-size="18" font-weight="700">A · Identity</text><text class="s" x="110" y="55" text-anchor="middle">family · exact revision</text><text class="s" x="110" y="75" text-anchor="middle">tokenizer · template · license</text><rect class="fact" x="0" y="120" width="220" height="120" rx="14"/><text x="110" y="150" text-anchor="middle" font-size="18" font-weight="700">B · Architecture</text><text class="s" x="110" y="176" text-anchor="middle">layers · hidden · FFN</text><text class="s" x="110" y="196" text-anchor="middle">Q heads · KV heads · RoPE</text><text class="s" x="110" y="216" text-anchor="middle">MoE / hybrid attention</text><rect class="fact" x="0" y="265" width="220" height="95" rx="14"/><text x="110" y="295" text-anchor="middle" font-size="18" font-weight="700">C · Artifact</text><text class="s" x="110" y="320" text-anchor="middle">format · quant · bytes</text><text class="s" x="110" y="340" text-anchor="middle">SHA · conversion source</text></g><path class="arrow" d="M265 270 H360"/><g transform="translate(365 135)"><rect class="box" x="0" y="0" width="290" height="230" rx="16"/><text x="145" y="34" text-anchor="middle" font-size="18" font-weight="700">Derived budgets</text><text class="t" x="28" y="80">weight payload / artifact reality</text><text class="t" x="28" y="116">KV bytes at target context</text><text class="t" x="28" y="152">concurrency / headroom</text><text class="t" x="28" y="188">special operator / backend needs</text><text class="s" x="145" y="216" text-anchor="middle">derived ≠ measured</text></g><path class="arrow" d="M660 250 H745"/><g transform="translate(750 90)"><rect class="box" x="0" y="0" width="340" height="310" rx="16"/><text x="170" y="35" text-anchor="middle" font-size="18" font-weight="700">D · Runtime hypothesis</text><text class="t" x="32" y="82">FIT: expected PASS / FAIL / UNKNOWN</text><text class="t" x="32" y="122">PP: likely compute / kernel limits</text><text class="t" x="32" y="162">TG: likely bandwidth / KV limits</text><text class="t" x="32" y="202">QUALITY: RoPE / quant / semantics risks</text><text class="t" x="32" y="242">SUPPORT: exact backend features</text><rect class="fact" x="28" y="260" width="284" height="34" rx="8"/><text class="s" x="170" y="282" text-anchor="middle">UNKNOWN stays visible until measured</text></g><text x="570" y="455" text-anchor="middle" class="t">Dossier 的价值不是“猜得准”，而是让下载/买卡前的假设有来源、可复查、可被真实 Evidence 推翻。</text></svg>