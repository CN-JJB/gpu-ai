<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
<title id="title">本地 LLM 服务的 bind address、网络边界、Auth、TLS 与隐私</title><desc id="desc">127.0.0.1只绑定本机，0.0.0.0绑定所有接口但是否公网可达还取决于防火墙路由VPN等；Auth与TLS分开，CORS不是Auth，metrics logs cache endpoints也可能泄露信息。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.zone{fill:#fff;stroke:#555;stroke-width:2}.gate{fill:#f3f3f3;stroke:#888;stroke-width:1.5}.arrow{stroke:#555;stroke-width:3;fill:none;marker-end:url(#m)}.h{font-size:23px;font-weight:700}.t{font-size:15px}.s{font-size:13px}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs>
<text class="h" x="35" y="38">0.0.0.0 只是“监听哪些本机接口”；是否被谁访问取决于整条 trust boundary</text>
<rect class="zone" x="55" y="115" width="260" height="245" rx="18"/><text x="185" y="148" text-anchor="middle" font-size="18" font-weight="700">Host</text><rect class="gate" x="90" y="180" width="190" height="70" rx="12"/><text class="t" x="185" y="210" text-anchor="middle">llama-server</text><text class="s" x="185" y="233" text-anchor="middle">127.0.0.1 or 0.0.0.0</text><rect class="gate" x="90" y="275" width="190" height="55" rx="12"/><text class="s" x="185" y="308" text-anchor="middle">metrics · logs · cache endpoints</text>
<path class="arrow" d="M320 235 H410"/>
<rect class="gate" x="415" y="140" width="225" height="190" rx="15"/><text x="527" y="173" text-anchor="middle" font-size="18" font-weight="700">Network controls</text><text class="t" x="527" y="205" text-anchor="middle">host firewall</text><text class="t" x="527" y="233" text-anchor="middle">router / NAT</text><text class="t" x="527" y="261" text-anchor="middle">VPN / security group</text><text class="t" x="527" y="289" text-anchor="middle">LAN segmentation</text>
<path class="arrow" d="M645 235 H735"/>
<rect class="zone" x="740" y="105" width="325" height="265" rx="18"/><text x="902" y="138" text-anchor="middle" font-size="18" font-weight="700">Who can reach it?</text><text class="t" x="790" y="185">you</text><text class="t" x="790" y="215">roommate / LAN device</text><text class="t" x="790" y="245">compromised IoT</text><text class="t" x="790" y="275">VPN peer</text><text class="t" x="790" y="305">Internet (only if routed/exposed)</text>
<rect class="gate" x="285" y="395" width="550" height="60" rx="12"/><text class="t" x="560" y="420" text-anchor="middle">Auth answers “who are you?” · TLS answers “can others read/modify the traffic?”</text><text class="s" x="560" y="441" text-anchor="middle">CORS is a browser policy, not an authentication system.</text>
</svg>