<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Local RAG evidence pipeline</title><desc id="desc">Documents are chunked and indexed, a query retrieves candidate chunks, a prompt is assembled with citations, the model generates an answer, and evaluation separates retrieval quality from generation faithfulness.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;fill:#18222c}.h{font-size:30px;font-weight:700}.t{font-size:17px;font-weight:700}.s{font-size:13px;fill:#52606d}.b{fill:#f6f8fb;stroke:#8ba0b5;stroke-width:2;rx:13}.r{fill:#eef6ff;stroke:#4f82b5;stroke-width:2;rx:13}.g{fill:#eef8f1;stroke:#5d966c;stroke-width:2;rx:13}.a{stroke:#5e6f7f;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#5e6f7f"/></marker></defs><text x="45" y="52" class="h">Challenge 09：RAG 要把“检索到了吗”和“回答忠实吗”分开评估</text><rect x="45" y="125" width="170" height="95" class="b"/><text x="130" y="163" text-anchor="middle" class="t">Documents</text><text x="130" y="192" text-anchor="middle" class="s">source identity</text><rect x="250" y="125" width="170" height="95" class="b"/><text x="335" y="163" text-anchor="middle" class="t">Chunk / index</text><text x="335" y="192" text-anchor="middle" class="s">embedding + metadata</text><rect x="455" y="125" width="170" height="95" class="r"/><text x="540" y="163" text-anchor="middle" class="t">Retrieve</text><text x="540" y="192" text-anchor="middle" class="s">top-k candidates</text><rect x="660" y="125" width="170" height="95" class="r"/><text x="745" y="163" text-anchor="middle" class="t">Prompt context</text><text x="745" y="192" text-anchor="middle" class="s">exact selected chunks</text><rect x="865" y="125" width="170" height="95" class="g"/><text x="950" y="163" text-anchor="middle" class="t">Generate</text><text x="950" y="192" text-anchor="middle" class="s">answer + citation</text><path d="M215 172 H243" class="a"/><path d="M420 172 H448" class="a"/><path d="M625 172 H653" class="a"/><path d="M830 172 H858" class="a"/><rect x="205" y="315" width="350" height="115" class="r"/><text x="380" y="355" text-anchor="middle" class="t">Retrieval evaluation</text><text x="380" y="387" text-anchor="middle" class="s">relevant chunk found? rank? recall?</text><rect x="645" y="315" width="350" height="115" class="g"/><text x="820" y="355" text-anchor="middle" class="t">Generation evaluation</text><text x="820" y="387" text-anchor="middle" class="s">answer supported by retrieved source?</text></svg>