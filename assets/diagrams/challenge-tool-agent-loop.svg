<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Tool calling agent loop</title><desc id="desc">A user request is interpreted by the model, which either answers or proposes a structured tool call. A policy gate validates the call, the tool returns an observation, and the model continues with that evidence. Side effects require stronger gates.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;fill:#18222c}.h{font-size:30px;font-weight:700}.t{font-size:17px;font-weight:700}.s{font-size:13px;fill:#52606d}.b{fill:#f6f8fb;stroke:#8ba0b5;stroke-width:2;rx:13}.m{fill:#eef6ff;stroke:#4f82b5;stroke-width:2;rx:13}.gate{fill:#fff7e8;stroke:#bd8a30;stroke-width:2;rx:13}.obs{fill:#eef8f1;stroke:#5d966c;stroke-width:2;rx:13}.a{stroke:#5e6f7f;stroke-width:3;fill:none;marker-end:url(#mk)}</style><defs><marker id="mk" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#5e6f7f"/></marker></defs><text x="45" y="52" class="h">Challenge 10：Tool-calling agent 的关键是结构化调用 + policy gate + 可追溯 observation</text><rect x="45" y="140" width="180" height="95" class="b"/><text x="135" y="178" text-anchor="middle" class="t">User request</text><rect x="290" y="140" width="200" height="95" class="m"/><text x="390" y="178" text-anchor="middle" class="t">Model decides</text><text x="390" y="207" text-anchor="middle" class="s">answer or tool call</text><rect x="555" y="140" width="210" height="95" class="gate"/><text x="660" y="178" text-anchor="middle" class="t">Policy / schema gate</text><text x="660" y="207" text-anchor="middle" class="s">args + permissions</text><rect x="830" y="140" width="160" height="95" class="b"/><text x="910" y="178" text-anchor="middle" class="t">Tool</text><text x="910" y="207" text-anchor="middle" class="s">external action/query</text><rect x="830" y="330" width="220" height="95" class="obs"/><text x="940" y="368" text-anchor="middle" class="t">Observation</text><text x="940" y="397" text-anchor="middle" class="s">result/error/provenance</text><path d="M225 187 H283" class="a"/><path d="M490 187 H548" class="a"/><path d="M765 187 H823" class="a"/><path d="M910 235 V323" class="a"/><path d="M830 378 H500 V242" class="a"/><text x="55" y="465" class="s">有副作用的 tool call 需要更强确认/权限边界；“模型生成了一个调用”不等于调用就应该被执行。</text></svg>