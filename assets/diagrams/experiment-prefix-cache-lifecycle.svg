<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Prefix cache lifecycle</title><desc id="desc">A request prefix is tokenized into an identity, looked up in cache, and either reuses cached KV state or computes and inserts new state; capacity pressure can evict older entries.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;fill:#18222c}.h{font-size:30px;font-weight:700}.t{font-size:18px;font-weight:700}.s{font-size:14px;fill:#52606d}.b{fill:#f6f8fb;stroke:#8ba0b5;stroke-width:2;rx:14}.hit{fill:#eef8f1;stroke:#5d966c;stroke-width:2;rx:14}.miss{fill:#fff7e8;stroke:#bd8a30;stroke-width:2;rx:14}.a{stroke:#5e6f7f;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#5e6f7f"/></marker></defs>
<text x="45" y="52" class="h">Experiment 13–14：Prefix cache 的关键不是“开了没”，而是 identity、hit、容量与 eviction</text>
<rect x="55" y="125" width="210" height="100" class="b"/><text x="160" y="165" text-anchor="middle" class="t">Prompt prefix</text><text x="160" y="195" text-anchor="middle" class="s">template + special tokens</text>
<rect x="330" y="125" width="210" height="100" class="b"/><text x="435" y="165" text-anchor="middle" class="t">Exact token identity</text><text x="435" y="195" text-anchor="middle" class="s">cache key / compatible state</text>
<rect x="605" y="125" width="210" height="100" class="b"/><text x="710" y="165" text-anchor="middle" class="t">Lookup</text><text x="710" y="195" text-anchor="middle" class="s">hit or miss?</text>
<rect x="895" y="90" width="245" height="100" class="hit"/><text x="1017" y="130" text-anchor="middle" class="t">HIT</text><text x="1017" y="160" text-anchor="middle" class="s">reuse cached KV / lower prefill work</text>
<rect x="895" y="245" width="245" height="115" class="miss"/><text x="1017" y="285" text-anchor="middle" class="t">MISS</text><text x="1017" y="315" text-anchor="middle" class="s">compute prefix → insert</text><text x="1017" y="340" text-anchor="middle" class="s">capacity pressure may evict old entry</text>
<path d="M265 175 H323" class="a"/><path d="M540 175 H598" class="a"/><path d="M815 155 H888" class="a"/><path d="M815 195 V302 H888" class="a"/>
<text x="55" y="420" class="t">实验判读：</text><text x="170" y="420" class="s">同“看起来相同”的文字不一定同 token identity；命中率提高也不保证总延迟一定下降，仍要看 cache cost 与 workload。</text>
</svg>