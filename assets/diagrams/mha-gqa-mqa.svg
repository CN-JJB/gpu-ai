<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 500" role="img" aria-labelledby="title desc">
<title id="title">MHA GQA MQA 的 Query heads 与 KV heads 共享关系</title><desc id="desc">MHA每个query head有独立K和V，GQA让一组query heads共享K和V，MQA让所有query heads共享一组K和V，从而显著减少KV cache。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.panel{fill:#fff;stroke:#555;stroke-width:2}.q{fill:#f0f0f0;stroke:#777}.kv{fill:#fff;stroke:#444;stroke-width:2}.line{stroke:#777;stroke-width:1.7}.h{font-size:23px;font-weight:700}.t{font-size:15px}.s{font-size:13px}</style>
<text class="h" x="35" y="38">Query heads 可以很多，但 KV heads 决定每个历史 token 要保存多少组 K/V</text>
<g transform="translate(30 85)"><rect class="panel" x="0" y="0" width="340" height="330" rx="16"/><text x="170" y="32" text-anchor="middle" font-size="19" font-weight="700">MHA</text><text class="s" x="170" y="55" text-anchor="middle">Q heads = KV heads</text><g transform="translate(40 90)"><rect class="q" x="0" y="0" width="45" height="38" rx="6"/><text class="s" x="22" y="24" text-anchor="middle">Q1</text><rect class="q" x="0" y="52" width="45" height="38" rx="6"/><text class="s" x="22" y="76" text-anchor="middle">Q2</text><rect class="q" x="0" y="104" width="45" height="38" rx="6"/><text class="s" x="22" y="128" text-anchor="middle">Q3</text><rect class="q" x="0" y="156" width="45" height="38" rx="6"/><text class="s" x="22" y="180" text-anchor="middle">Q4</text><rect class="kv" x="170" y="0" width="80" height="38" rx="6"/><text class="s" x="210" y="24" text-anchor="middle">K/V 1</text><rect class="kv" x="170" y="52" width="80" height="38" rx="6"/><text class="s" x="210" y="76" text-anchor="middle">K/V 2</text><rect class="kv" x="170" y="104" width="80" height="38" rx="6"/><text class="s" x="210" y="128" text-anchor="middle">K/V 3</text><rect class="kv" x="170" y="156" width="80" height="38" rx="6"/><text class="s" x="210" y="180" text-anchor="middle">K/V 4</text><path class="line" d="M45 19 H170 M45 71 H170 M45 123 H170 M45 175 H170"/></g><text class="t" x="170" y="302" text-anchor="middle">KV baseline：4 组</text></g>
<g transform="translate(400 85)"><rect class="panel" x="0" y="0" width="340" height="330" rx="16"/><text x="170" y="32" text-anchor="middle" font-size="19" font-weight="700">GQA</text><text class="s" x="170" y="55" text-anchor="middle">一组 Q heads 共享 K/V</text><g transform="translate(40 90)"><rect class="q" x="0" y="0" width="45" height="38" rx="6"/><text class="s" x="22" y="24" text-anchor="middle">Q1</text><rect class="q" x="0" y="52" width="45" height="38" rx="6"/><text class="s" x="22" y="76" text-anchor="middle">Q2</text><rect class="q" x="0" y="104" width="45" height="38" rx="6"/><text class="s" x="22" y="128" text-anchor="middle">Q3</text><rect class="q" x="0" y="156" width="45" height="38" rx="6"/><text class="s" x="22" y="180" text-anchor="middle">Q4</text><rect class="kv" x="170" y="26" width="80" height="48" rx="6"/><text class="s" x="210" y="55" text-anchor="middle">K/V A</text><rect class="kv" x="170" y="130" width="80" height="48" rx="6"/><text class="s" x="210" y="159" text-anchor="middle">K/V B</text><path class="line" d="M45 19 L170 50 M45 71 L170 50 M45 123 L170 154 M45 175 L170 154"/></g><text class="t" x="170" y="302" text-anchor="middle">KV baseline：2 组</text></g>
<g transform="translate(770 85)"><rect class="panel" x="0" y="0" width="340" height="330" rx="16"/><text x="170" y="32" text-anchor="middle" font-size="19" font-weight="700">MQA</text><text class="s" x="170" y="55" text-anchor="middle">所有 Q heads 共享一组 K/V</text><g transform="translate(40 90)"><rect class="q" x="0" y="0" width="45" height="38" rx="6"/><text class="s" x="22" y="24" text-anchor="middle">Q1</text><rect class="q" x="0" y="52" width="45" height="38" rx="6"/><text class="s" x="22" y="76" text-anchor="middle">Q2</text><rect class="q" x="0" y="104" width="45" height="38" rx="6"/><text class="s" x="22" y="128" text-anchor="middle">Q3</text><rect class="q" x="0" y="156" width="45" height="38" rx="6"/><text class="s" x="22" y="180" text-anchor="middle">Q4</text><rect class="kv" x="170" y="78" width="80" height="58" rx="6"/><text class="s" x="210" y="112" text-anchor="middle">K/V</text><path class="line" d="M45 19 L170 107 M45 71 L170 107 M45 123 L170 107 M45 175 L170 107"/></g><text class="t" x="170" y="302" text-anchor="middle">KV baseline：1 组</text></g>
<text x="570" y="458" text-anchor="middle" class="t">如果其他条件相同，KV cache ∝ kv_heads；但不同模型结构/quality/backend 不能只靠这张图直接排性能。</text></svg>