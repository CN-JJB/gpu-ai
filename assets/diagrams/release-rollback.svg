<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
<title id="title">LLM 服务安全升级、Release Gate 与 Rollback</title><desc id="desc">基线身份先冻结，candidate依次通过readiness、quality、SLO和performance gates；失败则rollback到原runtime model config身份并重新验证readiness与SLO。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.box{fill:#fff;stroke:#555;stroke-width:2}.gate{fill:#f3f3f3;stroke:#888;stroke-width:1.5}.arrow{stroke:#555;stroke-width:3;fill:none;marker-end:url(#m)}.fail{stroke:#888;stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#m)}.h{font-size:23px;font-weight:700}.t{font-size:15px}.s{font-size:13px}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs>
<text class="h" x="35" y="38">升级不是“新版本跑起来就算成功”；必须预先定义 Gate 和可验证 Rollback</text>
<rect class="box" x="55" y="105" width="185" height="95" rx="14"/><text x="147" y="136" text-anchor="middle" font-size="18" font-weight="700">Frozen baseline</text><text class="s" x="147" y="161" text-anchor="middle">runtime SHA · model SHA</text><text class="s" x="147" y="181" text-anchor="middle">config · workload · SLO</text>
<path class="arrow" d="M245 152 H305"/>
<rect class="box" x="310" y="105" width="170" height="95" rx="14"/><text x="395" y="136" text-anchor="middle" font-size="18" font-weight="700">Candidate</text><text class="s" x="395" y="161" text-anchor="middle">one declared change</text><text class="s" x="395" y="181" text-anchor="middle">or explicit system delta</text>
<path class="arrow" d="M485 152 H535"/>
<g transform="translate(540 85)"><rect class="gate" x="0" y="0" width="135" height="58" rx="10"/><text class="t" x="67" y="35" text-anchor="middle">Readiness</text><rect class="gate" x="0" y="72" width="135" height="58" rx="10"/><text class="t" x="67" y="107" text-anchor="middle">Quality</text><rect class="gate" x="0" y="144" width="135" height="58" rx="10"/><text class="t" x="67" y="179" text-anchor="middle">SLO</text><rect class="gate" x="0" y="216" width="135" height="58" rx="10"/><text class="t" x="67" y="251" text-anchor="middle">Performance</text></g>
<path class="arrow" d="M680 222 H755"/>
<rect class="box" x="760" y="175" width="190" height="95" rx="14"/><text x="855" y="207" text-anchor="middle" font-size="18" font-weight="700">Eligible release</text><text class="s" x="855" y="233" text-anchor="middle">human review</text><text class="s" x="855" y="253" text-anchor="middle">retain candidate evidence</text>
<path class="fail" d="M607 365 C607 425 260 425 260 250"/><text class="t" x="430" y="420" text-anchor="middle">Any hard gate FAIL → rollback</text>
<rect class="box" x="110" y="300" width="300" height="82" rx="13"/><text x="260" y="330" text-anchor="middle" font-size="17" font-weight="700">Rollback = restore identity</text><text class="s" x="260" y="354" text-anchor="middle">old runtime + model + config</text><text class="s" x="260" y="373" text-anchor="middle">then re-prove readiness / SLO</text>
<text x="560" y="475" text-anchor="middle" class="s">Failed candidate evidence is useful; deleting it destroys the reason the gate exists.</text>
</svg>