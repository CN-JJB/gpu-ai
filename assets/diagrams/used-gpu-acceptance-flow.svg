<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 550" role="img" aria-labelledby="title desc">
<title id="title">二手 GPU 从付款前到到货后的验收流程</title><desc id="desc">付款前只能降低明显风险，到货后按外观、低风险上电、身份与PCIe链路、显存错误、温度时钟和长时间稳定性逐步验证，最后输出ACCEPT REVIEW或REJECT。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.box{fill:#fff;stroke:#555;stroke-width:2}.stage{fill:#f3f3f3;stroke:#888;stroke-width:1.5}.arrow{stroke:#555;stroke-width:3;fill:none;marker-end:url(#m)}.h{font-size:23px;font-weight:700}.t{font-size:15px}.s{font-size:13px}</style>
<defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs>
<text class="h" x="35" y="38">卖家截图只能做 preflight；健康结论必须来自到货后的分层 Evidence</text>
<rect class="stage" x="45" y="100" width="190" height="95" rx="14"/><text x="140" y="130" text-anchor="middle" font-size="18" font-weight="700">Before pay</text><text class="s" x="140" y="154" text-anchor="middle">identity / labels / photos</text><text class="s" x="140" y="176" text-anchor="middle">seller evidence / return path</text>
<path class="arrow" d="M240 148 H280"/>
<rect class="stage" x="285" y="100" width="175" height="95" rx="14"/><text x="372" y="130" text-anchor="middle" font-size="18" font-weight="700">Visual arrival</text><text class="s" x="372" y="154" text-anchor="middle">connector / PCB / fan</text><text class="s" x="372" y="176" text-anchor="middle">damage / contamination</text>
<path class="arrow" d="M465 148 H505"/>
<rect class="stage" x="510" y="100" width="175" height="95" rx="14"/><text x="597" y="130" text-anchor="middle" font-size="18" font-weight="700">Safe first boot</text><text class="s" x="597" y="154" text-anchor="middle">idle / low-risk load</text><text class="s" x="597" y="176" text-anchor="middle">no instant full power</text>
<path class="arrow" d="M690 148 H730"/>
<rect class="stage" x="735" y="100" width="175" height="95" rx="14"/><text x="822" y="130" text-anchor="middle" font-size="18" font-weight="700">Identity + link</text><text class="s" x="822" y="154" text-anchor="middle">PCI IDs / VRAM / VBIOS</text><text class="s" x="822" y="176" text-anchor="middle">lane width / speed</text>
<path class="arrow" d="M915 148 H955"/>
<rect class="stage" x="960" y="100" width="145" height="95" rx="14"/><text x="1032" y="130" text-anchor="middle" font-size="18" font-weight="700">Memory</text><text class="s" x="1032" y="154" text-anchor="middle">VRAM errors</text><text class="s" x="1032" y="176" text-anchor="middle">repeatability</text>
<path class="arrow" d="M1032 200 V250 H825"/>
<rect class="stage" x="650" y="255" width="350" height="105" rx="14"/><text x="825" y="285" text-anchor="middle" font-size="18" font-weight="700">Thermal + sustained workload</text><text class="s" x="825" y="310" text-anchor="middle">temperature / hotspot → clocks → power → fan</text><text class="s" x="825" y="333" text-anchor="middle">20–60+ min drift / driver errors / TG stability</text>
<path class="arrow" d="M645 307 H565"/>
<rect class="box" x="75" y="250" width="480" height="112" rx="16"/><text x="315" y="281" text-anchor="middle" font-size="18" font-weight="700">Evidence result ≠ one “healthy” checkbox</text><text class="t" x="315" y="311" text-anchor="middle">identity · link · memory · thermal · sustained performance</text><text class="s" x="315" y="338" text-anchor="middle">每一层分别记录 PASS / FAIL / UNKNOWN 与证据强度</text>
<path class="arrow" d="M570 365 V420"/>
<rect class="box" x="235" y="430" width="180" height="70" rx="14"/><text x="325" y="472" text-anchor="middle" font-size="18" font-weight="700">ACCEPT</text>
<rect class="box" x="480" y="430" width="180" height="70" rx="14"/><text x="570" y="472" text-anchor="middle" font-size="18" font-weight="700">REVIEW</text>
<rect class="box" x="725" y="430" width="180" height="70" rx="14"/><text x="815" y="472" text-anchor="middle" font-size="18" font-weight="700">REJECT</text>
<text x="570" y="530" text-anchor="middle" class="s">短跑通过不能覆盖长时间稳定性；异常也不要被一个“平均分数”吞掉。</text></svg>