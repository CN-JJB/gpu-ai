<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Prompt template and token identity pipeline</title><desc id="desc">User messages pass through a chat template and special-token insertion before tokenization, producing the exact token IDs consumed by the model; visually similar prompts can therefore have different token identity.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;fill:#18222c}.h{font-size:30px;font-weight:700}.t{font-size:18px;font-weight:700}.s{font-size:14px;fill:#52606d}.b{fill:#f6f8fb;stroke:#8ba0b5;stroke-width:2;rx:14}.mid{fill:#fff7e8;stroke:#bd8a30;stroke-width:2;rx:14}.out{fill:#eef8f1;stroke:#5d966c;stroke-width:2;rx:14}.a{stroke:#5d6e7d;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#5d6e7d"/></marker></defs><text x="45" y="52" class="h">Experiment 56–57：模型真正吃的是 token IDs，不是你肉眼看到的聊天文字</text><rect x="45" y="135" width="240" height="115" class="b"/><text x="165" y="177" text-anchor="middle" class="t">messages</text><text x="165" y="207" text-anchor="middle" class="s">system / user / assistant</text><rect x="345" y="135" width="250" height="115" class="mid"/><text x="470" y="177" text-anchor="middle" class="t">chat template</text><text x="470" y="207" text-anchor="middle" class="s">role markers + separators</text><rect x="655" y="135" width="220" height="115" class="mid"/><text x="765" y="177" text-anchor="middle" class="t">tokenizer</text><text x="765" y="207" text-anchor="middle" class="s">special tokens included</text><rect x="935" y="135" width="220" height="115" class="out"/><text x="1045" y="177" text-anchor="middle" class="t">exact token IDs</text><text x="1045" y="207" text-anchor="middle" class="s">model input identity</text><path d="M285 192 H338" class="a"/><path d="M595 192 H648" class="a"/><path d="M875 192 H928" class="a"/><text x="55" y="350" class="t">实验判读：</text><text x="170" y="350" class="s">同一句可见文本，如果 template / tokenizer / special-token policy 不同，token 数、prefix cache identity、PPL/benchmark 条件都可能变化。</text></svg>