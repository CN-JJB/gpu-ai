<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 520" role="img" aria-labelledby="title desc"><title id="title">MoE 中 Router Active Experts Resident Experts 与跨设备 Traffic</title><desc id="desc">多个token经过router选择top-k experts，每个token只激活少量专家做计算，但所有专家权重仍需驻留在某处，跨设备expert会产生interconnect traffic。</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.box{fill:#fff;stroke:#555;stroke-width:2}.expert{fill:#f3f3f3;stroke:#888;stroke-width:1.5}.active{fill:#fff;stroke:#222;stroke-width:3}.arrow{stroke:#555;stroke-width:2.4;fill:none;marker-end:url(#m)}.dash{stroke:#888;stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#m)}.h{font-size:23px;font-weight:700}.t{font-size:15px}.s{font-size:13px}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs><text class="h" x="35" y="38">MoE 的“active parameters 少”解决的是 compute，不自动解决 resident storage</text><g transform="translate(40 100)"><rect class="box" x="0" y="0" width="130" height="60" rx="10"/><text class="t" x="65" y="37" text-anchor="middle">token A</text><rect class="box" x="0" y="82" width="130" height="60" rx="10"/><text class="t" x="65" y="119" text-anchor="middle">token B</text><rect class="box" x="0" y="164" width="130" height="60" rx="10"/><text class="t" x="65" y="201" text-anchor="middle">token C</text></g><rect class="box" x="260" y="150" width="160" height="110" rx="14"/><text x="340" y="185" text-anchor="middle" font-size="18" font-weight="700">Router</text><text class="s" x="340" y="212" text-anchor="middle">score experts</text><text class="s" x="340" y="234" text-anchor="middle">choose top-k</text><path class="arrow" d="M175 130 H255 M175 212 H255 M175 294 C220 294 225 245 255 235"/><g transform="translate(530 75)"><rect class="expert active" x="0" y="0" width="150" height="68" rx="10"/><text class="t" x="75" y="29" text-anchor="middle">Expert 1</text><text class="s" x="75" y="50" text-anchor="middle">active for A</text><rect class="expert" x="0" y="85" width="150" height="68" rx="10"/><text class="t" x="75" y="114" text-anchor="middle">Expert 2</text><text class="s" x="75" y="135" text-anchor="middle">resident</text><rect class="expert active" x="0" y="170" width="150" height="68" rx="10"/><text class="t" x="75" y="199" text-anchor="middle">Expert 3</text><text class="s" x="75" y="220" text-anchor="middle">active for A/B</text><rect class="expert" x="0" y="255" width="150" height="68" rx="10"/><text class="t" x="75" y="284" text-anchor="middle">Expert 4…8</text><text class="s" x="75" y="305" text-anchor="middle">still need storage</text></g><path class="arrow" d="M425 190 C465 155 485 115 525 110"/><path class="arrow" d="M425 205 H525"/><path class="arrow" d="M425 220 C470 260 485 285 525 285"/><rect class="box" x="790" y="110" width="275" height="105" rx="14"/><text x="927" y="143" text-anchor="middle" font-size="18" font-weight="700">Resident weight budget</text><text class="t" x="927" y="171" text-anchor="middle">shared layers + ALL experts</text><text class="s" x="927" y="194" text-anchor="middle">unless some experts are offloaded elsewhere</text><rect class="box" x="790" y="265" width="275" height="105" rx="14"/><text x="927" y="298" text-anchor="middle" font-size="18" font-weight="700">Active compute per token</text><text class="t" x="927" y="326" text-anchor="middle">shared layers + top-k experts</text><text class="s" x="927" y="349" text-anchor="middle">much smaller than total parameter count</text><path class="dash" d="M685 110 H785"/><path class="arrow" d="M685 210 C735 235 745 315 785 315"/><text x="570" y="445" text-anchor="middle" class="t">如果 expert 分散在多 GPU / RAM：router 选择不仅决定 compute，也决定 token 要不要跨 interconnect 搬运。</text><text x="570" y="475" text-anchor="middle" class="s">因此“100B total / 10B active”不能直接按 10B 买显存；先问剩余 90B 放在哪里。</text></svg>