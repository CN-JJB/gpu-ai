<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Speculative decoding acceptance flow</title><desc id="desc">A draft model proposes multiple tokens, the target verifies them in a batch, accepts a prefix until the first rejection, then continues; speedup depends on acceptance and verification overhead.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;fill:#18222c}.h{font-size:30px;font-weight:700}.t{font-size:18px;font-weight:700}.s{font-size:14px;fill:#52606d}.d{fill:#eef6ff;stroke:#4f82b5;stroke-width:2;rx:14}.v{fill:#f4f0ff;stroke:#7965b0;stroke-width:2;rx:14}.ok{fill:#eef8f1;stroke:#5d966c;stroke-width:2;rx:12}.no{fill:#fff0f0;stroke:#b85c5c;stroke-width:2;rx:12}.a{stroke:#5f6f7f;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#5f6f7f"/></marker></defs>
<text x="45" y="52" class="h">Experiment 15–16：Speculative decoding 的收益 = 接受更多 token − draft/verify 额外成本</text>
<rect x="55" y="120" width="260" height="120" class="d"/><text x="185" y="160" text-anchor="middle" class="t">Draft proposes k tokens</text><text x="185" y="195" text-anchor="middle" class="s">t1 t2 t3 t4 ...</text><text x="185" y="220" text-anchor="middle" class="s">cheap but not authoritative</text>
<rect x="405" y="120" width="260" height="120" class="v"/><text x="535" y="160" text-anchor="middle" class="t">Target verifies</text><text x="535" y="195" text-anchor="middle" class="s">parallel/batched verification</text><text x="535" y="220" text-anchor="middle" class="s">still pays target work</text>
<rect x="755" y="95" width="180" height="80" class="ok"/><text x="845" y="127" text-anchor="middle" class="t">accept prefix</text><text x="845" y="153" text-anchor="middle" class="s">t1 t2 t3</text>
<rect x="755" y="215" width="180" height="80" class="no"/><text x="845" y="247" text-anchor="middle" class="t">reject at t4</text><text x="845" y="273" text-anchor="middle" class="s">stop accepting after mismatch</text>
<rect x="1000" y="145" width="155" height="100" class="d"/><text x="1077" y="180" text-anchor="middle" class="t">continue</text><text x="1077" y="208" text-anchor="middle" class="s">new context</text>
<path d="M315 180 H398" class="a"/><path d="M665 160 H748" class="a"/><path d="M665 200 H710 V255 H748" class="a"/><path d="M935 135 H970 V195 H993" class="a"/>
<text x="55" y="390" class="t">只看 acceptance rate 不够：</text><text x="295" y="390" class="s">draft latency + target verify cost + accepted tokens / cycle + synchronization / memory pressure 一起决定最终 tok/s 与 latency。</text>
</svg>