<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 530" role="img" aria-labelledby="title desc">
<title id="title">AMD 从 GCN/Vega 分化为 RDNA 与 CDNA 的架构路线图</title>
<desc id="desc">显示 GCN 和 Vega 之后分成面向消费图形的 RDNA1到4与面向AI/HPC的CDNA1到5，两条路线共享GPU基础概念但优化目标不同。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.node{fill:#fff;stroke:#555;stroke-width:2}.branch{fill:#f3f3f3;stroke:#888;stroke-width:1.5}.line{stroke:#555;stroke-width:3;fill:none}.dash{stroke:#888;stroke-width:2;stroke-dasharray:7 5;fill:none}.h{font-size:23px;font-weight:700}.t{font-size:15px}.s{font-size:13px}</style>
<text class="h" x="35" y="38">AMD 的关键不是“代数”，而是 Vega 之后形成两条不同优化目标的路线</text>
<rect class="node" x="60" y="190" width="150" height="80" rx="14"/><text x="135" y="221" text-anchor="middle" font-size="18" font-weight="700">GCN</text><text class="s" x="135" y="246" text-anchor="middle">wavefront · CU · LDS</text>
<path class="line" d="M210 230 H280"/>
<rect class="node" x="285" y="190" width="150" height="80" rx="14"/><text x="360" y="221" text-anchor="middle" font-size="18" font-weight="700">Vega</text><text class="s" x="360" y="246" text-anchor="middle">HBM / compute + graphics</text>
<path class="line" d="M435 230 H500 M500 230 V120 M500 230 V365"/>

<text x="570" y="88" font-size="19" font-weight="700">RDNA：消费图形 / 能效 / 游戏 + AI features</text>
<path class="line" d="M500 120 H1080"/>
<g transform="translate(535 125)">
<rect class="branch" x="0" y="0" width="112" height="62" rx="10"/><text class="t" x="56" y="27" text-anchor="middle">RDNA 1</text><text class="s" x="56" y="47" text-anchor="middle">Wave32 / WGP</text>
<rect class="branch" x="135" y="0" width="112" height="62" rx="10"/><text class="t" x="191" y="27" text-anchor="middle">RDNA 2</text><text class="s" x="191" y="47" text-anchor="middle">cache / RT</text>
<rect class="branch" x="270" y="0" width="112" height="62" rx="10"/><text class="t" x="326" y="27" text-anchor="middle">RDNA 3</text><text class="s" x="326" y="47" text-anchor="middle">chiplet package</text>
<rect class="branch" x="405" y="0" width="112" height="62" rx="10"/><text class="t" x="461" y="27" text-anchor="middle">RDNA 4</text><text class="s" x="461" y="47" text-anchor="middle">AI path 更显式</text>
</g>

<text x="590" y="333" font-size="19" font-weight="700">CDNA：AI / HPC / HBM / matrix / scale-up fabric</text>
<path class="line" d="M500 365 H1080"/>
<g transform="translate(525 375)">
<rect class="branch" x="0" y="0" width="100" height="62" rx="10"/><text class="t" x="50" y="27" text-anchor="middle">CDNA 1</text><text class="s" x="50" y="47" text-anchor="middle">compute-first</text>
<rect class="branch" x="112" y="0" width="100" height="62" rx="10"/><text class="t" x="162" y="27" text-anchor="middle">CDNA 2</text><text class="s" x="162" y="47" text-anchor="middle">multi-die</text>
<rect class="branch" x="224" y="0" width="100" height="62" rx="10"/><text class="t" x="274" y="27" text-anchor="middle">CDNA 3</text><text class="s" x="274" y="47" text-anchor="middle">chiplet + HBM</text>
<rect class="branch" x="336" y="0" width="100" height="62" rx="10"/><text class="t" x="386" y="27" text-anchor="middle">CDNA 4</text><text class="s" x="386" y="47" text-anchor="middle">MX low precision</text>
<rect class="branch" x="448" y="0" width="100" height="62" rx="10"/><text class="t" x="498" y="27" text-anchor="middle">CDNA 5</text><text class="s" x="498" y="47" text-anchor="middle">WGP / HBM4</text>
</g>
<path class="dash" d="M640 245 C735 270 810 285 905 310"/><text class="s" x="790" y="268" text-anchor="middle">名字/代数不能横向等价比较</text>
<text x="570" y="500" text-anchor="middle" class="t">共同问题：wave/lane group · registers · LDS · bandwidth；不同问题：产品目标、matrix 数值路径、memory system、software deployment。</text>
</svg>