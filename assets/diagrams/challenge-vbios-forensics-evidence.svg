<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">VBIOS/OEM forensics evidence chain</title><desc id="desc">A safe forensics workflow compares read-only device identity, board/OEM identifiers, firmware metadata and trusted reference sources before forming a bounded conclusion; writing firmware is outside the diagram.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;fill:#18222c}.h{font-size:30px;font-weight:700}.t{font-size:18px;font-weight:700}.s{font-size:14px;fill:#52606d}.b{fill:#f6f8fb;stroke:#8ba0b5;stroke-width:2;rx:14}.safe{fill:#eef8f1;stroke:#5d966c;stroke-width:2;rx:14}.warn{fill:#fff7e8;stroke:#bd8a30;stroke-width:2;rx:14}.a{stroke:#5e6f7f;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#5e6f7f"/></marker></defs><text x="45" y="52" class="h">Challenge 02：VBIOS / OEM 考古先做只读身份交叉验证</text><rect x="45" y="125" width="225" height="105" class="safe"/><text x="157" y="165" text-anchor="middle" class="t">Read-only device ID</text><text x="157" y="197" text-anchor="middle" class="s">PCI ID / subsystem / board</text><rect x="325" y="125" width="225" height="105" class="b"/><text x="437" y="165" text-anchor="middle" class="t">Firmware metadata</text><text x="437" y="197" text-anchor="middle" class="s">version / hash / reported limits</text><rect x="605" y="125" width="225" height="105" class="b"/><text x="717" y="165" text-anchor="middle" class="t">Trusted references</text><text x="717" y="197" text-anchor="middle" class="s">OEM/vendor docs + known board IDs</text><rect x="885" y="125" width="270" height="105" class="safe"/><text x="1020" y="165" text-anchor="middle" class="t">Bounded conclusion</text><text x="1020" y="197" text-anchor="middle" class="s">match / mismatch / UNKNOWN</text><path d="M270 177 H318" class="a"/><path d="M550 177 H598" class="a"/><path d="M830 177 H878" class="a"/><rect x="245" y="320" width="710" height="100" class="warn"/><text x="600" y="357" text-anchor="middle" class="t">边界：本图不包含 firmware 写入/强刷步骤</text><text x="600" y="390" text-anchor="middle" class="s">Challenge 的目标是建立 provenance 与 mismatch Evidence；写入动作需要另行安全门槛，不是主线完成条件。</text></svg>