<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">单位、估算与实测的关系</title><desc id="desc">通过量纲守恒从带宽除以每 token 搬运字节得到 token 每秒上界，并区分数量级估算、工程估算和实测。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;fill:#18222c}.h{font-size:30px;font-weight:700}.t{font-size:21px;font-weight:700}.s{font-size:16px;fill:#53616f}.b{fill:#f6f8fb;stroke:#8ba0b5;stroke-width:2;rx:16}.roof{fill:#eef6ff;stroke:#4f82b5;stroke-width:2;rx:16}.m{fill:#eef8f1;stroke:#5d986c;stroke-width:2;rx:16}.a{stroke:#5b6b7a;stroke-width:3;fill:none;marker-end:url(#mk)}</style>
<defs><marker id="mk" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#5b6b7a"/></marker></defs>
<text x="45" y="52" class="h">Foundation 03：先守住量纲，再谈“数字看起来像不像”</text>
<rect x="60" y="105" width="300" height="130" class="b"/><text x="210" y="145" text-anchor="middle" class="t">memory bandwidth</text><text x="210" y="180" text-anchor="middle" class="s">600 GB / s</text><text x="210" y="207" text-anchor="middle" class="s">单位：bytes / second</text>
<rect x="450" y="105" width="300" height="130" class="b"/><text x="600" y="145" text-anchor="middle" class="t">bytes moved / token</text><text x="600" y="180" text-anchor="middle" class="s">≈ 5 GB / token</text><text x="600" y="207" text-anchor="middle" class="s">这是 workload 假设</text>
<rect x="840" y="105" width="300" height="130" class="roof"/><text x="990" y="145" text-anchor="middle" class="t">ideal bandwidth roof</text><text x="990" y="180" text-anchor="middle" class="s">600 ÷ 5 = 120 token / s</text><text x="990" y="207" text-anchor="middle" class="s">上界，不是保证</text>
<path d="M360 170 H443" class="a"/><path d="M750 170 H833" class="a"/>
<text x="405" y="151" class="s">÷</text><text x="793" y="151" class="s">=</text>
<rect x="90" y="330" width="280" height="110" class="b"/><text x="230" y="370" text-anchor="middle" class="t">数量级估算</text><text x="230" y="402" text-anchor="middle" class="s">快速排除明显不可能</text>
<rect x="460" y="330" width="280" height="110" class="roof"/><text x="600" y="370" text-anchor="middle" class="t">工程估算</text><text x="600" y="402" text-anchor="middle" class="s">加入 overhead / headroom</text>
<rect x="830" y="330" width="280" height="110" class="m"/><text x="970" y="370" text-anchor="middle" class="t">Measured value</text><text x="970" y="402" text-anchor="middle" class="s">真实 artifact + 真机 Evidence</text>
<path d="M370 385 H453" class="a"/><path d="M740 385 H823" class="a"/>
<text x="365" y="486" class="s">GB / GiB、bit / byte、tok/s、J/token 都要显式写单位；裸数字没有足够语义。</text>
</svg>