<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">SwiGLU FFN 的 Gate Up Down 数据流</title><desc id="desc">输入x同时进入up projection和gate projection，gate经过SiLU后与up逐元素相乘，再经过down projection回到hidden size并与residual相加。</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.box{fill:#fff;stroke:#555;stroke-width:2}.op{fill:#f3f3f3;stroke:#888;stroke-width:1.5}.arrow{stroke:#555;stroke-width:3;fill:none;marker-end:url(#m)}.h{font-size:23px;font-weight:700}.t{font-size:15px}.s{font-size:13px}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs><text class="h" x="35" y="38">SwiGLU 的参数大头不是“一个 FFN 矩阵”，而是三条大 projection</text><rect class="box" x="55" y="170" width="120" height="70" rx="12"/><text class="t" x="115" y="199" text-anchor="middle">input x</text><text class="s" x="115" y="221" text-anchor="middle">hidden H</text><path class="arrow" d="M180 205 C230 205 235 120 285 120"/><path class="arrow" d="M180 205 C230 205 235 290 285 290"/><rect class="box" x="290" y="85" width="170" height="70" rx="12"/><text class="t" x="375" y="113" text-anchor="middle">W_up</text><text class="s" x="375" y="135" text-anchor="middle">H → I</text><rect class="box" x="290" y="255" width="170" height="70" rx="12"/><text class="t" x="375" y="283" text-anchor="middle">W_gate</text><text class="s" x="375" y="305" text-anchor="middle">H → I</text><path class="arrow" d="M465 120 H545"/><path class="arrow" d="M465 290 H505 V235 H545"/><rect class="op" x="550" y="198" width="150" height="75" rx="12"/><text class="t" x="625" y="226" text-anchor="middle">SiLU(gate) ⊙ up</text><text class="s" x="625" y="250" text-anchor="middle">elementwise mix</text><path class="arrow" d="M705 235 H785"/><rect class="box" x="790" y="198" width="160" height="75" rx="12"/><text class="t" x="870" y="226" text-anchor="middle">W_down</text><text class="s" x="870" y="250" text-anchor="middle">I → H</text><path class="arrow" d="M955 235 H1020"/><rect class="op" x="1025" y="198" width="70" height="75" rx="12"/><text class="t" x="1060" y="230" text-anchor="middle">+ x</text><text class="s" x="1060" y="251" text-anchor="middle">residual</text><text x="570" y="365" text-anchor="middle" class="t">参数量粗略：H×I + H×I + I×H = 3HI；quantization 因此会强烈影响 FFN weight bytes。</text><text x="570" y="395" text-anchor="middle" class="s">Gate 的“门”是数值调制，不是运行时简单把一半神经元跳过，因此不能直接推成一半计算量。</text></svg>