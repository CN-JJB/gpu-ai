<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">RMSNorm scale flow</title><desc id="desc">An input vector is reduced to a root mean square statistic, normalized by that scalar, then multiplied elementwise by learned scale weights; the operation changes scale without subtracting the mean.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;fill:#18222c}.h{font-size:30px;font-weight:700}.t{font-size:18px;font-weight:700}.s{font-size:14px;fill:#52606d}.b{fill:#f6f8fb;stroke:#8ba0b5;stroke-width:2;rx:14}.n{fill:#eef6ff;stroke:#4f82b5;stroke-width:2;rx:14}.g{fill:#eef8f1;stroke:#5d966c;stroke-width:2;rx:14}.a{stroke:#5e6f7f;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#5e6f7f"/></marker></defs><text x="45" y="52" class="h">Experiment 44：RMSNorm 关注向量“整体尺度”，不做 mean subtraction</text><rect x="55" y="135" width="215" height="110" class="b"/><text x="162" y="176" text-anchor="middle" class="t">input x</text><text x="162" y="208" text-anchor="middle" class="s">[d] vector</text><rect x="330" y="135" width="250" height="110" class="n"/><text x="455" y="176" text-anchor="middle" class="t">RMS(x)</text><text x="455" y="208" text-anchor="middle" class="s">sqrt(mean(x²) + eps)</text><rect x="640" y="135" width="235" height="110" class="n"/><text x="757" y="176" text-anchor="middle" class="t">x / RMS(x)</text><text x="757" y="208" text-anchor="middle" class="s">normalize scale</text><rect x="935" y="135" width="220" height="110" class="g"/><text x="1045" y="176" text-anchor="middle" class="t">× learned weight</text><text x="1045" y="208" text-anchor="middle" class="s">elementwise γ</text><path d="M270 190 H323" class="a"/><path d="M580 190 H633" class="a"/><path d="M875 190 H928" class="a"/><text x="55" y="335" class="t">实验要改什么？</text><text x="200" y="335" class="s">输入尺度；观察 RMS 与归一化后向量，确认不是把“RMSNorm”误记成 LayerNorm 的同义词。</text></svg>