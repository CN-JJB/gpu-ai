<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
<title id="title">LLM Serving 一次请求中的 TTFT ITL E2E 与吞吐</title><desc id="desc">从request arrival经过queue、prompt processing、first token，再到连续生成token和完成，标出TTFT、ITL和E2E区间，并提醒aggregate throughput与单用户速度不同。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.stage{fill:#fff;stroke:#555;stroke-width:2}.wait{fill:#f3f3f3;stroke:#888;stroke-width:1.5}.line{stroke:#555;stroke-width:3}.mark{stroke:#888;stroke-width:2;stroke-dasharray:5 4}.h{font-size:23px;font-weight:700}.t{font-size:15px}.s{font-size:13px}</style>
<text class="h" x="35" y="38">一次请求至少有三种“慢”：等第一字、字与字之间、从头到尾</text>
<line class="line" x1="70" y1="180" x2="1050" y2="180"/>
<g><rect class="wait" x="105" y="135" width="190" height="90" rx="12"/><text class="t" x="200" y="165" text-anchor="middle">Queue</text><text class="s" x="200" y="190" text-anchor="middle">等待 slot / admission</text>
<rect class="stage" x="310" y="135" width="210" height="90" rx="12"/><text class="t" x="415" y="165" text-anchor="middle">Prompt processing</text><text class="s" x="415" y="190" text-anchor="middle">prefill / cache miss work</text>
<rect class="stage" x="570" y="135" width="100" height="90" rx="12"/><text class="t" x="620" y="165" text-anchor="middle">token 1</text><text class="s" x="620" y="190" text-anchor="middle">first visible</text>
<rect class="stage" x="700" y="135" width="80" height="90" rx="12"/><text class="t" x="740" y="165" text-anchor="middle">t2</text><text class="s" x="740" y="190" text-anchor="middle">gap</text>
<rect class="stage" x="810" y="135" width="80" height="90" rx="12"/><text class="t" x="850" y="165" text-anchor="middle">t3</text><text class="s" x="850" y="190" text-anchor="middle">gap</text>
<rect class="stage" x="920" y="135" width="90" height="90" rx="12"/><text class="t" x="965" y="165" text-anchor="middle">… done</text><text class="s" x="965" y="190" text-anchor="middle">last token</text></g>
<line class="mark" x1="70" y1="115" x2="70" y2="270"/><line class="mark" x1="620" y1="115" x2="620" y2="270"/><line class="mark" x1="1010" y1="115" x2="1010" y2="270"/>
<text class="t" x="345" y="95" text-anchor="middle">TTFT = arrival → first token</text>
<text class="t" x="800" y="270" text-anchor="middle">ITL = token-to-token gaps</text>
<text class="t" x="540" y="315" text-anchor="middle">E2E = arrival → completion</text>
<rect class="wait" x="130" y="345" width="860" height="55" rx="12"/><text class="s" x="560" y="377" text-anchor="middle">Aggregate tok/s 可以上升，同时单用户 ITL / p95 TTFT 变差；Serving 不能只报一个 throughput 数。</text>
</svg>