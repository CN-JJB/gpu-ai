<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">多租户 LLM 服务中的 slot quota 与 work-conserving borrowing</title><desc id="desc">两个租户的请求成本差异很大，Global FIFO可能让短请求被长请求阻塞；每租户quota加work-conserving borrowing可保护最低份额并在空闲时借用资源。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#171717}.box{fill:#fff;stroke:#555;stroke-width:2}.tenant{fill:#f3f3f3;stroke:#888;stroke-width:1.5}.arrow{stroke:#555;stroke-width:3;fill:none;marker-end:url(#m)}.h{font-size:23px;font-weight:700}.t{font-size:15px}.s{font-size:13px}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#555"/></marker></defs>
<text class="h" x="35" y="38">“每人两个 request”不公平，因为 request 不是统一成本单位</text>
<g transform="translate(55 95)"><rect class="tenant" x="0" y="0" width="220" height="120" rx="14"/><text x="110" y="32" text-anchor="middle" font-size="18" font-weight="700">Tenant A</text><text class="t" x="110" y="64" text-anchor="middle">A1 · 1000 output tokens</text><text class="t" x="110" y="90" text-anchor="middle">A2 · 1000 output tokens</text>
<rect class="tenant" x="0" y="160" width="220" height="120" rx="14"/><text x="110" y="192" text-anchor="middle" font-size="18" font-weight="700">Tenant B</text><text class="t" x="110" y="224" text-anchor="middle">B1…B4 · 50 tokens each</text><text class="s" x="110" y="250" text-anchor="middle">short interactive work</text></g>
<path class="arrow" d="M280 190 H380"/>
<rect class="box" x="385" y="125" width="280" height="185" rx="16"/><text x="525" y="158" text-anchor="middle" font-size="18" font-weight="700">Fair scheduler</text><text class="t" x="525" y="190" text-anchor="middle">minimum per-tenant active quota</text><text class="t" x="525" y="218" text-anchor="middle">+ token / KV / queue budgets</text><text class="t" x="525" y="246" text-anchor="middle">+ work-conserving borrowing</text><text class="s" x="525" y="278" text-anchor="middle">unused share can be borrowed, but not permanently stolen</text>
<path class="arrow" d="M670 190 H770"/>
<g transform="translate(775 115)"><rect class="box" x="0" y="0" width="290" height="80" rx="13"/><text class="t" x="145" y="31" text-anchor="middle">Slot 1 · Tenant A / borrowed</text><text class="s" x="145" y="55" text-anchor="middle">long work allowed, bounded share</text>
<rect class="box" x="0" y="105" width="290" height="80" rx="13"/><text class="t" x="145" y="136" text-anchor="middle">Slot 2 · Tenant B / borrowed</text><text class="s" x="145" y="160" text-anchor="middle">short work not starved</text></g>
<rect class="tenant" x="265" y="355" width="590" height="70" rx="12"/><text class="t" x="560" y="383" text-anchor="middle">Fairness report 要按 tenant 分开看 queue / TTFT / ITL / throughput / KV share</text><text class="s" x="560" y="405" text-anchor="middle">global p95 正常不能证明某个 tenant 没被饿死。</text>
</svg>