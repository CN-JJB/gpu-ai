<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">LoRA and QLoRA adapter flow</title><desc id="desc">A frozen base weight path is augmented by a low-rank A and B adapter path; QLoRA stores the base in quantized form while training adapter parameters, and evaluation compares base and adapted behavior under fixed protocol.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;fill:#18222c}.h{font-size:30px;font-weight:700}.t{font-size:18px;font-weight:700}.s{font-size:14px;fill:#52606d}.base{fill:#f6f8fb;stroke:#8ba0b5;stroke-width:2;rx:14}.ad{fill:#eef6ff;stroke:#4f82b5;stroke-width:2;rx:14}.out{fill:#eef8f1;stroke:#5d966c;stroke-width:2;rx:14}.a{stroke:#5e6f7f;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#5e6f7f"/></marker></defs><text x="45" y="52" class="h">Challenge 08：LoRA/QLoRA = 冻结 base + 训练低秩增量，不是“重新训练整个模型”</text><rect x="55" y="175" width="170" height="95" class="base"/><text x="140" y="214" text-anchor="middle" class="t">input x</text><rect x="315" y="105" width="260" height="105" class="base"/><text x="445" y="145" text-anchor="middle" class="t">Frozen base W</text><text x="445" y="177" text-anchor="middle" class="s">QLoRA: quantized storage</text><rect x="315" y="285" width="120" height="90" class="ad"/><text x="375" y="325" text-anchor="middle" class="t">A</text><text x="375" y="351" text-anchor="middle" class="s">d → r</text><rect x="475" y="285" width="120" height="90" class="ad"/><text x="535" y="325" text-anchor="middle" class="t">B</text><text x="535" y="351" text-anchor="middle" class="s">r → d</text><rect x="700" y="175" width="220" height="95" class="out"/><text x="810" y="214" text-anchor="middle" class="t">Wx + BAx</text><text x="810" y="244" text-anchor="middle" class="s">adapted output</text><rect x="990" y="145" width="165" height="155" class="out"/><text x="1072" y="187" text-anchor="middle" class="t">Eval gate</text><text x="1015" y="222" class="s">same prompts</text><text x="1015" y="250" class="s">same protocol</text><text x="1015" y="278" class="s">base vs adapter</text><path d="M225 222 H270 V157 H308" class="a"/><path d="M225 222 H270 V330 H308" class="a"/><path d="M435 330 H468" class="a"/><path d="M575 157 H650 V210 H693" class="a"/><path d="M595 330 H650 V235 H693" class="a"/><path d="M920 222 H983" class="a"/></svg>