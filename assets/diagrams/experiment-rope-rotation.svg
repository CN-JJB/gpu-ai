<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">RoPE 2D rotation intuition</title><desc id="desc">A pair of embedding coordinates is rotated by a position-dependent angle. Two positions rotate by different angles so their dot product depends on relative position.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;fill:#18222c}.h{font-size:30px;font-weight:700}.t{font-size:18px;font-weight:700}.s{font-size:14px;fill:#52606d}.axis{stroke:#8a96a3;stroke-width:2}.v1{stroke:#4f82b5;stroke-width:5;marker-end:url(#b)}.v2{stroke:#5d966c;stroke-width:5;marker-end:url(#g)}.arc{stroke:#bd8a30;stroke-width:3;fill:none}</style><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#4f82b5"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#5d966c"/></marker></defs><text x="45" y="52" class="h">Experiment 45：RoPE 把位置编码成每个二维 pair 的旋转角</text><line x1="180" y1="365" x2="520" y2="365" class="axis"/><line x1="340" y1="420" x2="340" y2="105" class="axis"/><line x1="340" y1="365" x2="475" y2="250" class="v1"/><line x1="340" y1="365" x2="415" y2="175" class="v2"/><path d="M420 365 A80 80 0 0 0 402 315" class="arc"/><text x="452" y="324" class="s">position p → θp</text><text x="485" y="245" class="s">rotated q/k at p</text><text x="420" y="167" class="s">rotated q/k at p+Δ</text><rect x="650" y="130" width="470" height="235" rx="16" fill="#f6f8fb" stroke="#8ba0b5" stroke-width="2"/><text x="885" y="175" text-anchor="middle" class="t">为什么 relative position 会出现？</text><text x="690" y="220" class="s">同一频率下，两位置的角度差是 Δθ。</text><text x="690" y="255" class="s">旋转后的 q·k 因此依赖角度差，而不是只依赖绝对角。</text><text x="690" y="300" class="s">实验重点：改变 position / base / scale，观察相对角变化。</text><text x="690" y="335" class="s">这张图是二维直觉；真实模型会在多个 pair 上使用不同频率。</text></svg>