name: Course Readiness

on:
  push:
    paths:
      - "README.md"
      - "COURSE-MAP.md"
      - "curriculum/**"
      - "lessons/**"
      - "labs/experiments/**"
      - "labs/challenges/**"
      - "reference/**"
      - "tools/course/**"
      - ".github/workflows/course-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile audits
        run: python -m py_compile tools/course/audit_student_readiness.py tools/course/audit_visual_comprehension.py tools/course/audit_auxiliary_visual_comprehension.py
      - name: Audit student course readiness
        run: python tools/course/audit_student_readiness.py
      - name: Audit lesson visual and comprehension closure
        run: python tools/course/audit_visual_comprehension.py
      - name: Audit auxiliary visual and comprehension closure
        run: python tools/course/audit_auxiliary_visual_comprehension.py
