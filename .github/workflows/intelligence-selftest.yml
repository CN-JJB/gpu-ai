name: Intelligence Self-Test

on:
  push:
    paths:
      - "tools/intelligence/**"
      - "intelligence/catalog/**"
      - "intelligence/schema/**"
      - ".github/workflows/intelligence-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile intelligence tools
        run: python -m py_compile tools/intelligence/*.py
      - name: Run intelligence self-test
        run: python tools/intelligence/selftest.py
      - name: Run real benchmark capture self-test
        run: python tools/intelligence/capture_real_benchmark_selftest.py
      - name: Run model artifact gate self-test
        run: python tools/intelligence/model_artifact_gate_selftest.py
      - name: Run market refresh self-test
        run: python tools/intelligence/market_refresh_selftest.py
