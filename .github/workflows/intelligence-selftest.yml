name: Intelligence Self-Test

on:
  push:
    paths:
      - "tools/intelligence/**"
      - "intelligence/catalog/**"
      - "intelligence/schema/**"
      - ".github/workflows/intelligence-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile intelligence tools
        run: python -m py_compile tools/intelligence/*.py
      - name: Run intelligence self-test
        run: python tools/intelligence/selftest.py
      - name: Run real benchmark capture self-test
        run: python tools/intelligence/capture_real_benchmark_selftest.py
      - name: Run model artifact gate self-test
        run: python tools/intelligence/model_artifact_gate_selftest.py
      - name: Run command-model binding self-test
        run: python tools/intelligence/command_model_binding_selftest.py
      - name: Run hardware profile gate self-test
        run: python tools/intelligence/hardware_profile_gate_selftest.py
      - name: Run prompt evidence gate self-test
        run: python tools/intelligence/prompt_evidence_gate_selftest.py
      - name: Run quality corpus gate self-test
        run: python tools/intelligence/quality_corpus_gate_selftest.py
      - name: Run quality identity gate self-test
        run: python tools/intelligence/quality_identity_gate_selftest.py
      - name: Run quality execution self-test
        run: python tools/intelligence/quality_execution_selftest.py
      - name: Run quality evaluation argv self-test
        run: python tools/intelligence/quality_evaluation_args_selftest.py
      - name: Run quality metric self-test
        run: python tools/intelligence/quality_metric_selftest.py
      - name: Run quality comparison self-test
        run: python tools/intelligence/quality_comparison_selftest.py
      - name: Run quality comparison artifact self-test
        run: python tools/intelligence/quality_comparison_artifact_selftest.py
      - name: Run reproducible performance-quality binding self-test
        run: python tools/intelligence/joint_tradeoff_selftest.py
      - name: Run joint tradeoff artifact self-test
        run: python tools/intelligence/joint_tradeoff_artifact_selftest.py
      - name: Run quality execution-variable self-test
        run: python tools/intelligence/quality_execution_variable_selftest.py
      - name: Run quality execution-variable artifact self-test
        run: python tools/intelligence/quality_execution_variable_artifact_selftest.py
      - name: Run execution performance-quality binding self-test
        run: python tools/intelligence/execution_joint_tradeoff_selftest.py
      - name: Run execution joint tradeoff artifact self-test
        run: python tools/intelligence/execution_joint_tradeoff_artifact_selftest.py
      - name: Run unified tradeoff routing self-test
        run: python tools/intelligence/unified_tradeoff_route_selftest.py
      - name: Run decision evidence gap self-test
        run: python tools/intelligence/decision_evidence_gap_selftest.py
      - name: Run used GPU acceptance self-test
        run: python tools/intelligence/used_gpu_acceptance_selftest.py
      - name: Run used GPU acceptance readiness bridge self-test
        run: python tools/intelligence/used_gpu_acceptance_readiness_bridge_selftest.py
      - name: Run performance target self-test
        run: python tools/intelligence/performance_target_selftest.py
      - name: Run performance target readiness bridge self-test
        run: python tools/intelligence/performance_target_readiness_bridge_selftest.py
      - name: Run price ceiling self-test
        run: python tools/intelligence/price_ceiling_selftest.py
      - name: Run price ceiling readiness bridge self-test
        run: python tools/intelligence/price_ceiling_readiness_bridge_selftest.py
      - name: Run quality execution + metric intake self-test
        run: python tools/intelligence/quality_execution_intake_selftest.py
      - name: Run market refresh self-test
        run: python tools/intelligence/market_refresh_selftest.py
